[project]
name = "object-detection-tracking"
version = "0.1.0"
description = "Real-time object detection + multi-object tracking pipeline (VisDrone, YOLOv8, ByteTrack) with full MLOps and a free-tier CPU demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "scripts", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, C4: comprehensions, SIM: simplify
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by black
    "B008",   # function calls in argument defaults (common in CLI/typer)
    "SIM300", # allow natural `actual == expected` order in test assertions
]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
