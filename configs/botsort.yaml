# BoT-SORT tracker config (Ultralytics-compatible). Alternative to
# ByteTrack with camera-motion compensation; ByteTrack is the default
# used for MOTA reporting in this project.
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 30
match_thresh: 0.8
fuse_score: true

# BoT-SORT specifics
gmc_method: sparseOptFlow  # global motion compensation method
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: false           # ReID disabled to stay light on CPU
